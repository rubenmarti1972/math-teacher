<section class="page-shell auth-wrap">
  <div class="auth glass-card">
    <p class="kicker">Acceso seguro</p>
    <h1>Portal de estudiantes y docentes</h1>
    <p class="caption">Autenticación base JWT preparada para integrarse con Strapi 5.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email">Correo institucional</label>
      <input id="email" type="email" formControlName="email" placeholder="docente@academia.com" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" />

      <button type="submit">Ingresar al dashboard</button>
    </form>
  </div>
</section>
